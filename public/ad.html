    <script>
      const observer = new ResizeObserver(entries => {
        for (let entry of entries) {
           if (window.parent) {
             window.parent.postMessage({ 
               type: 'resize', 
               height: document.body.scrollHeight, 
               id: window.name
             }, '*');
           }
        }
      });
      observer.observe(document.body);
      
      setInterval(() => {
        if (window.parent) {
          window.parent.postMessage({ 
            type: 'resize', 
            height: document.body.scrollHeight, 
            id: window.name 
          }, '*');
        }
      }, 2000);
    </script>
